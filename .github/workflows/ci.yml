name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu
            os: ubuntu-latest
            cmake_flags: ""
            run_tests: true
            run_bench: true    # x86 baseline - compared against the arm64 leg below

          - name: cuda
            os: ubuntu-latest
            cmake_flags: "-DSTAKML_CUDA=ON"
            run_tests: false   # no GPU on GitHub-hosted runners - build-only smoke test

          - name: vulkan
            os: ubuntu-latest
            cmake_flags: "-DSTAKML_VULKAN=ON"
            run_tests: false   # no GPU on GitHub-hosted runners - build-only smoke test

          - name: arm64
            os: ubuntu-24.04-arm
            cmake_flags: ""
            run_tests: true    # real AArch64 hardware - full ctest suite runs natively
            run_bench: true    # compared against the cpu (x86) leg above

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libomp-dev

      - name: Install CUDA toolkit
        if: matrix.name == 'cuda'
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-toolkit
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"

      - name: Install Vulkan SDK + shader tools
        if: matrix.name == 'vulkan'
        run: sudo apt-get install -y libvulkan-dev glslang-tools

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        if: matrix.run_tests
        run: ctest --test-dir build --output-on-failure

      - name: Run benchmark
        if: matrix.run_bench
        run: ./build/bench

      - name: Check NEON auto-vectorization on matmul
        if: matrix.name == 'arm64'
        run: |
          g++ -O3 -march=native -ffast-math -fopenmp -Iinclude \
              -fopt-info-vec-optimized -c tests/bench.cpp -o /tmp/bench.o 2>&1 \
              | tee /tmp/vecreport.txt | grep -i "tensor.hpp" \
              || echo "No vectorization report lines matched tensor.hpp - inspect /tmp/vecreport.txt manually"
